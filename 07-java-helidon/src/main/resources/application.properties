server.port=8080
server.host=0.0.0.0

checkout.vr.limite=300
checkout.idempotencia.ttl-segundos=10
checkout.sqs.habilitado=true
checkout.sqs.endpoint=http://localhost:4566
checkout.sqs.region=us-east-1
checkout.sqs.fila=fila-notificacao-checkout

# DataSource JPA
javax.sql.DataSource.checkout.dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
javax.sql.DataSource.checkout.dataSource.serverName=localhost
javax.sql.DataSource.checkout.dataSource.portNumber=5432
javax.sql.DataSource.checkout.dataSource.databaseName=checkout_db
javax.sql.DataSource.checkout.dataSource.user=postgres
javax.sql.DataSource.checkout.dataSource.password=1234

javax.enterprise.inject.spi.BeanManager.introduction=true
mp.initializer.allow-core-pool-size-decrease=true

# Habilita as métricas para o Fault Tolerance inicializar sem erros
mp.metrics.enabled=true
mp.metrics.extension.enabled=true
mp.fault.tolerance.metrics.enabled=true