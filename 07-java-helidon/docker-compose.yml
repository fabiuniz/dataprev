services:
  postgres:
    image: postgres:15-alpine
    container_name: pg-checkout-helidon
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: checkout_db
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: redis-checkout-helidon
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-SuaSenhaSuperSegura123}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-SuaSenhaSuperSegura123} ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.0.2
    container_name: localstack-checkout-helidon
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 30