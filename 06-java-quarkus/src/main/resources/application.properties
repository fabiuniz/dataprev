quarkus.application.name=checkout-quarkus
quarkus.http.port=8080

# ---------- Banco ----------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=update

# ---------- Regras de negócio (@ConfigMapping "checkout") ----------
checkout.vr.limite=300
checkout.idempotencia.ttl-segundos=10
checkout.sqs.habilitado=true
checkout.sqs.endpoint=http://localhost:4566
checkout.sqs.region=us-east-1
checkout.sqs.fila=fila-notificacao-checkout

# ---------- DEV: infraestrutura do docker-compose.yml ----------
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.redis.devservices.enabled=false
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=1234
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/checkout_db
%dev.quarkus.redis.hosts=redis://default:${REDIS_PASSWORD:SuaSenhaSuperSegura123}@localhost:6379

# ---------- PROD: tudo por variável de ambiente ----------
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:1234}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/checkout_db}
%prod.quarkus.redis.hosts=${REDIS_URL:redis://default:SuaSenhaSuperSegura123@localhost:6379}
%prod.checkout.sqs.endpoint=${SQS_ENDPOINT:http://localhost:4566}

# ---------- TEST: Dev Services sobe Postgres e Redis (precisa de Docker) ----------
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.checkout.sqs.habilitado=false
